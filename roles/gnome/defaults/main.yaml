# What the installer's "GNOME" choice installs. Its gnome metapackage
# depends on LibreOffice, which the libreoffice role blocks, so that one is
# skipped and the rest (task-desktop, gnome-core, ...) goes in.
gnome_task: task-gnome-desktop

gnome_packages:
  - bibata-cursor-theme
  - gnome-calendar
  - gnome-contacts
  - gnome-themes-extra    # dark mode for legacy GTK3 apps
  - papirus-icon-theme
  - python3-psutil        # needed by the dconf module

# Each extension with everything it needs:
#   uuid          what gets enabled
#   apt           the Debian package, without it it comes from extensions.gnome.org
#   packages      extra apt packages it needs
#   desktop_only  skipped on laptops
#   dconf         where its settings live, needed with settings
#   settings      its dconf settings, only applied where it is installed
gnome_extensions:
  # Debian ships it under its Ubuntu uuid, not the extensions.gnome.org one.
  - uuid: ubuntu-appindicators@ubuntu.com
    apt: gnome-shell-extension-appindicator
  - uuid: caffeine@patapon.info
    apt: gnome-shell-extension-caffeine
  # Dash to Dock, without the monitor it is pinned to on aorus.
  - uuid: dash-to-dock@micxgx.gmail.com
    apt: gnome-shell-extension-dashtodock
    dconf: /org/gnome/shell/extensions/dash-to-dock
    settings:
      animation-time: "0.2"
      apply-custom-theme: "false"
      autohide: "true"
      autohide-in-fullscreen: "false"
      background-opacity: "0.8"
      custom-theme-shrink: "false"
      dash-max-icon-size: "48"
      dock-fixed: "false"
      dock-position: "'BOTTOM'"
      extend-height: "false"
      height-fraction: "0.9"
      hide-delay: "0.2"
      intellihide: "true"
      intellihide-mode: "'ALL_WINDOWS'"
      pressure-threshold: "100.0"
      require-pressure-to-show: "true"
      show-delay: "0.25"
      show-dock-urgent-notify: "false"
      show-mounts-network: "false"
  - uuid: gsconnect@andyholmes.github.io
    apt: gnome-shell-extension-gsconnect
  - uuid: AlphabeticalAppGrid@stuarthayhurst
  - uuid: BingWallpaper@ineffable-gmail.com
  - uuid: Bluetooth-Battery-Meter@maniacx.github.com
  # Copyous needs libgda (with SQLite) and GSound.
  - uuid: copyous@boerdereinar.dev
    packages: [gir1.2-gda-5.0, gir1.2-gsound-1.0]
  - uuid: quick-settings-audio-panel@rayzeq.github.io
  # Monitor brightness over DDC, only useful with external monitors so laptops
  # skip it. Slider in the system menu (0 is the top bar, 1 the system menu)
  # and the display state check skipped.
  - uuid: display-brightness-ddcutil@themightydeity.github.com
    packages: [ddcutil]
    desktop_only: true
    dconf: /org/gnome/shell/extensions/display-brightness-ddcutil
    settings:
      button-location: "1"
      disable-display-state-check: "true"

# unzip unpacks the extensions.gnome.org downloads.
gnome_extension_dependencies:
  - unzip

gnome_firewall_rules:
  - { port: "1714:1764", proto: tcp, comment: gsconnect }
  - { port: "1714:1764", proto: udp, comment: gsconnect }

gnome_dconf:
  /org/gnome/desktop/interface/color-scheme: "'prefer-dark'"
  /org/gnome/desktop/interface/gtk-theme: "'Adwaita-dark'"
  /org/gnome/desktop/interface/icon-theme: "'Papirus-Dark'"
  /org/gnome/desktop/interface/cursor-theme: "'Bibata-Modern-Classic'"
  # Tweaks' "Minimize" titlebar button.
  /org/gnome/desktop/wm/preferences/button-layout: "'appmenu:minimize,close'"
  # Tweaks' "Mouse Acceleration" off, the pointer moves 1:1 with the mouse.
  /org/gnome/desktop/peripherals/mouse/accel-profile: "'flat'"
  # No folders in the app grid, Alphabetical App Grid keeps it sorted. An
  # empty list makes GNOME Shell recreate its default folders on the next
  # login, so keep YaST and Pardus: they only hold openSUSE and Pardus apps,
  # stay empty on Debian and the grid hides empty folders.
  /org/gnome/desktop/app-folders/folder-children: "['YaST', 'Pardus']"
  # GNOME Software's "Automatic Updates", updates are still shown, just not
  # downloaded and installed in the background.
  /org/gnome/software/download-updates: "false"
  # Mutter's experimental features. variable-refresh-rate adds the "Variable
  # Refresh Rate" toggle in Settings > Displays for VRR capable monitors (it
  # still has to be turned on there per monitor). The other two are the
  # fractional scaling ones; this key is the whole list, so they're kept here.
  /org/gnome/mutter/experimental-features: >-
    ['scale-monitor-framebuffer', 'xwayland-native-scaling', 'variable-refresh-rate']
  /org/gnome/shell/favorite-apps: >-
    ['app.zen_browser.zen.desktop', 'com.bitwarden.desktop.desktop', 'org.gnome.Geary.desktop',
    'org.gnome.Calendar.desktop', 'io.github.mrvladus.List.desktop', 'org.gnome.TextEditor.desktop',
    'org.gnome.Nautilus.desktop', 'md.obsidian.Obsidian.desktop', 'com.github.flxzt.rnote.desktop',
    'com.obsproject.Studio.desktop', 'io.missioncenter.MissionCenter.desktop',
    'io.github.Qalculate.desktop', 'com.microsoft.VSCode.desktop', 'org.gnome.Software.desktop',
    'virt-manager.desktop', 'org.gnome.Terminal.desktop']
