# Everything in /var/lib/apt/lists except apt's lock file and its
# partial/ download directory, apt-get update fetches the rest again.
- name: Find the downloaded package lists
  ansible.builtin.find:
    paths: /var/lib/apt/lists
    file_type: any
    excludes: [lock, partial]
  register: maintenance_apt_lists
  when: maintenance_reset_apt_lists

- name: Remove the downloaded package lists
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ maintenance_apt_lists.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: maintenance_reset_apt_lists

- name: Upgrade apt packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: "{{ maintenance_apt_upgrade }}"

- name: Remove packages that are no longer required
  ansible.builtin.apt:
    autoremove: true
    purge: true

# All downloaded .deb files, including the ones this upgrade just used.
- name: Empty the apt package cache
  ansible.builtin.apt:
    clean: true

- name: Check for flatpak
  ansible.builtin.stat:
    path: /usr/bin/flatpak
  register: maintenance_flatpak

- name: Update flatpaks
  ansible.builtin.command: flatpak update --noninteractive -y
  register: maintenance_flatpak_update
  changed_when: "'Nothing to do' not in maintenance_flatpak_update.stdout"
  when: maintenance_flatpak.stat.exists
