- name: Install gaming flatpaks
  community.general.flatpak:
    name: "{{ gaming_flatpaks }}"
    state: present

# The flatpak module only matches on name, so with one branch installed it
# would skip the others. Check each branch on its own instead.
- name: Check installed MangoHud branches
  ansible.builtin.command: "flatpak info --system org.freedesktop.Platform.VulkanLayer.MangoHud//{{ item }}"
  loop: "{{ gaming_mangohud_branches }}"
  register: gaming_mangohud_info
  changed_when: false
  check_mode: false
  failed_when: false

- name: Install MangoHud
  ansible.builtin.command: "flatpak install --system --noninteractive -y flathub org.freedesktop.Platform.VulkanLayer.MangoHud//{{ item.item }}"
  loop: "{{ gaming_mangohud_info.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc != 0
  changed_when: true

- name: Apply gaming sysctl settings
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/99-gaming.conf
    reload: true
  loop: "{{ gaming_sysctl | dict2items }}"

- name: Start Steam with the session
  ansible.builtin.include_role:
    name: autostart
  vars:
    autostart_entries: "{{ gaming_autostart }}"
