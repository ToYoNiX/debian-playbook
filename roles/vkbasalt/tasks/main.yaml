# The flatpak module only matches on name, so with one branch installed it
# would skip the others. Check each branch on its own instead.
- name: Check installed vkBasalt branches
  ansible.builtin.command: "flatpak info --system org.freedesktop.Platform.VulkanLayer.vkBasalt//{{ item }}"
  loop: "{{ vkbasalt_branches }}"
  register: vkbasalt_info
  changed_when: false
  check_mode: false
  failed_when: false

- name: Install vkBasalt
  ansible.builtin.command: "flatpak install --system --noninteractive -y flathub org.freedesktop.Platform.VulkanLayer.vkBasalt//{{ item.item }}"
  loop: "{{ vkbasalt_info.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc != 0
  changed_when: true
