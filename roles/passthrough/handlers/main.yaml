- name: Update grub
  ansible.builtin.command: update-grub
  changed_when: true
  notify: Remind to reboot

- name: Update initramfs
  ansible.builtin.command: update-initramfs -u
  changed_when: true
  notify: Remind to reboot

- name: Remind to reboot
  ansible.builtin.debug:
    msg: Passthrough config changed, reboot {{ inventory_hostname }} to apply it.
