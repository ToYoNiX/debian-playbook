- name: Add the NVIDIA container toolkit repository
  vars:
    nvidia_ctk_channels: "{{ ['stable', 'experimental'] if nvidia_ctk_experimental else ['stable'] }}"
  ansible.builtin.deb822_repository:
    name: nvidia-container-toolkit
    types: deb
    uris: >-
      {{ nvidia_ctk_channels
         | map('regex_replace', '^', 'https://nvidia.github.io/libnvidia-container/')
         | map('regex_replace', '$', '/deb/' ~ nvidia_ctk_arch) | list }}
    suites: /
    signed_by: https://nvidia.github.io/libnvidia-container/gpgkey

- name: Install the NVIDIA container toolkit
  vars:
    nvidia_ctk_packages:
      - nvidia-container-toolkit
      - nvidia-container-toolkit-base
      - libnvidia-container-tools
      - libnvidia-container1
  ansible.builtin.apt:
    name: "{{ nvidia_ctk_packages | map('regex_replace', '$', '=' ~ nvidia_ctk_version) | list if nvidia_ctk_version else nvidia_ctk_packages }}"
    state: present
    update_cache: true

- name: Check if Docker already has the nvidia runtime
  ansible.builtin.command: grep -q '"nvidia"' /etc/docker/daemon.json
  register: nvidia_ctk_runtime
  changed_when: false
  check_mode: false
  failed_when: false

- name: Configure the nvidia runtime for Docker
  ansible.builtin.command: nvidia-ctk runtime configure --runtime=docker
  when: nvidia_ctk_runtime.rc != 0
  changed_when: true
  notify: Restart docker
