dwl_repo: https://github.com/toyonix/dwl
dwl_version: HEAD
dwl_src_dir: /usr/local/src/dwl

dwl_build_dependencies:
  - cmake
  - git
  - libcap-dev
  - libdbus-1-dev
  - libdisplay-info-dev
  - libdrm-dev
  - libegl1-mesa-dev
  - libepoxy-dev
  - libfcft-dev
  - libgbm-dev
  - libgles2-mesa-dev
  - libinput-dev
  - liblcms2-dev
  - libliftoff-dev
  - libpixman-1-dev
  - libseat-dev
  - libsystemd-dev
  - libvulkan-dev
  - libwayland-dev
  - libwlroots-0.18-dev
  - libx11-xcb-dev
  - libxcb-composite0-dev
  - libxcb-damage0-dev
  - libxcb-dri3-dev
  - libxcb-ewmh-dev
  - libxcb-glx0-dev
  - libxcb-icccm4-dev
  - libxcb-image0-dev
  - libxcb-present-dev
  - libxcb-render-util0-dev
  - libxcb-render0-dev
  - libxcb-res0-dev
  - libxcb-shape0-dev
  - libxcb-shm0-dev
  - libxcb-sync-dev
  - libxcb-xfixes0-dev
  - libxcb-xinput-dev
  - libxkbcommon-dev
  - meson
  - ninja-build
  - wayland-protocols

dwl_packages:
  - blueman
  - bluetooth
  - foot
  - fuzzel
  - grim
  - libnotify-bin
  - mako-notifier
  - slurp
  - wl-clipboard
  - xwayland

# Terminal mail, calendar, todos and contacts. vdirsyncer syncs CalDAV and
# CardDAV into local folders that khal, todoman and khard read.
dwl_pim_packages:
  - aerc        # mail
  - khal        # calendar
  - khard       # contacts
  - todoman     # todos
  - vdirsyncer  # CalDAV/CardDAV sync
