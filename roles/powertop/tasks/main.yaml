- name: Install powertop
  ansible.builtin.apt:
    name: powertop
    state: present

- name: Add the powertop service
  ansible.builtin.template:
    src: powertop.service.j2
    dest: /etc/systemd/system/powertop.service
    mode: "0644"
  notify: Restart powertop

- name: Enable powertop auto-tune on boot
  ansible.builtin.systemd_service:
    name: powertop.service
    enabled: true
    state: started
    daemon_reload: true
