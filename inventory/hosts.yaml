# Each group is a "category" of machine. A host gets every category it is
# listed under, e.g. a laptop can be in gnome, notetaking and development.
# Connection details and passwords go in inventory/host_vars/<host>/secrets.yaml
# (ignored by git, see inventory/host_vars/secrets.yaml.example).
all:
  children:
    desktop:
      children:
        gnome:
          hosts:
            hoopoe: {}
            aorus: {}
        dwl:
          hosts: {}
    power:
      children:
        laptop:
          hosts:
            hoopoe: {}
        server:
          hosts:
            orca: {}
            fluffy: {}
    nvidia:
      hosts:
        aorus: {}
    notetaking:
      hosts:
        hoopoe: {}
        aorus: {}
    gaming:
      hosts:
        aorus: {}
    # FreeCAD and PrusaSlicer. Ansible group names can't start with a digit,
    # so not "3d".
    cad:
      hosts:
        aorus: {}
    videoediting:
      hosts:
        aorus: {}
    # Media and game streaming clients.
    entertainment:
      hosts:
        hoopoe: {}
        aorus: {}
    # Hosts the HP printer is plugged into.
    printing:
      hosts:
        aorus: {}
    # Microcontrollers, keyboard firmware and Android flashing.
    embedded:
      hosts:
        hoopoe: {}
        aorus: {}
    development:
      hosts:
        hoopoe: {}
        aorus: {}
    docker:
      hosts:
        orca: {}
        hoopoe: {}
        fluffy: {}
        aorus: {}
    virtualization:
      hosts:
        aorus: {}
      children:
        passthrough:
          hosts: {}
