- name: Desktop base
  hosts: desktop
  become: true
  # A dry run (--check) installs nothing, so later steps that need those
  # packages fail. Keep going so the whole run is shown, real runs still stop.
  ignore_errors: "{{ ansible_check_mode }}"
  roles:
    - pipewire
    - fonts
    - libreoffice
    - gparted
    - imagemagick
    - mpv
    - yt_dlp
    - syncthing
    - zen_browser
    - bitwarden
    - chrome
    - discord
    - flatseal
    - gear_lever
    - graphs
    - handbrake
    - inkscape
    - keypunch
    - mission_center
    - obs_studio
    - plots
    - putty
    - qalculate
    - qbittorrent
    - telegram
    - zoom

- name: GNOME desktops
  hosts: gnome
  become: true
  # A dry run (--check) installs nothing, so later steps that need those
  # packages fail. Keep going so the whole run is shown, real runs still stop.
  ignore_errors: "{{ ansible_check_mode }}"
  roles:
    - gnome
    - extension_manager
    - decoder
    - gdm_settings
    - errands
    - geary

- name: Desktops running dwl
  hosts: dwl
  become: true
  # A dry run (--check) installs nothing, so later steps that need those
  # packages fail. Keep going so the whole run is shown, real runs still stop.
  ignore_errors: "{{ ansible_check_mode }}"
  roles:
    - ly
    - dwl
    - swhkd
