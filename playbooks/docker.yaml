- name: Docker hosts
  hosts: docker
  become: true
  # A dry run (--check) installs nothing, so later steps that need those
  # packages fail. Keep going so the whole run is shown, real runs still stop.
  ignore_errors: "{{ ansible_check_mode }}"
  roles:
    - docker

- name: GPU containers on Docker hosts with NVIDIA
  hosts: docker:&nvidia
  become: true
  # A dry run (--check) installs nothing, so later steps that need those
  # packages fail. Keep going so the whole run is shown, real runs still stop.
  ignore_errors: "{{ ansible_check_mode }}"
  roles:
    - nvidia_ctk
